<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Regent Parking</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-icon-large">🅿️</span>
      <h1>Regent <span class="gold-accent-dark">Parking</span></h1>
      <p>Staff Portal — Reset your password</p>
    </div>

    <div class="alert alert-error hidden" id="forgot-error"></div>
    <div class="alert alert-success hidden" id="forgot-success"></div>

    <form id="forgot-form" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" class="form-control" placeholder="staff@condo.com" required autocomplete="email" />
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Send Reset Link</button>
    </form>

    <div style="text-align:center;margin-top:16px">
      <a href="login.html" style="font-size:.85rem;color:var(--muted)">← Back to Sign In</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/app.js"></script>
<script>
  const form      = document.getElementById('forgot-form');
  const errEl     = document.getElementById('forgot-error');
  const successEl = document.getElementById('forgot-success');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errEl.classList.add('hidden');
    successEl.classList.add('hidden');

    const email = document.getElementById('email').value.trim();
    if (!email) return;

    submitBtn.textContent = 'Sending…';
    submitBtn.disabled = true;

    try {
      const redirectTo = window.location.origin.replace(/\/$/, '') + '/reset-password.html';
      await requestPasswordReset(email, redirectTo);
    } catch (err) {
      // Fall through to the same generic message either way — see
      // requestPasswordReset()'s comment in app.js for why this never
      // reveals whether the email actually has an account.
    }

    form.classList.add('hidden');
    successEl.textContent = 'If an account exists for ' + email + ', a password reset link has been sent. Check your inbox (and spam folder).';
    successEl.classList.remove('hidden');
  });
</script>
</body>
</html>
